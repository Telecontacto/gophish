# Runs as UID 10001. All writable paths are relative to a private runtime prefix.
worker_processes 1;
pid nginx.pid;
# Nginx errors may include the complete request URI (including API keys).
error_log /dev/null;
events { worker_connections 1024; }
http {
    access_log off;
    client_body_temp_path body;
    proxy_temp_path proxy;
    fastcgi_temp_path fastcgi;
    uwsgi_temp_path uwsgi;
    scgi_temp_path scgi;
    server_tokens off;
    # Preserve application upload limits rather than introducing Nginx's 1 MiB cap.
    client_max_body_size 0;
    server {
        listen 3334;
        location / {
            proxy_pass http://127.0.0.1:3333;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            # This listener must only be routed through Railway's HTTPS edge.
            # Overwrite client-supplied protocol/Forwarded values, never trust them.
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Forwarded "";
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_redirect off;
        }
    }
}
